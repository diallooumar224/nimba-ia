<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nimba IA — Agent autonome</title>
  <meta name="description" content="Nimba IA : un agent IA autonome qui planifie, utilise des outils, mémorise et produit des fichiers, directement dans votre navigateur." />
  <meta name="theme-color" content="#0f1412" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <div class="app" id="app">
    <!-- Barre latérale -->
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20 L9 7 L13 13 L16 9 L22 20 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="17" cy="4.5" r="1.6" fill="currentColor"/></svg>
        <span>Nimba IA</span>
      </div>
      <button class="btn btn-primary btn-block" id="newChat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Nouvelle mission
      </button>
      <input class="input search" id="searchChats" type="search" placeholder="Rechercher…" aria-label="Rechercher une conversation" />
      <nav class="chat-list" id="chatList"></nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-block" id="openSettings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          Paramètres
        </button>
      </div>
    </aside>

    <!-- Zone principale -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="toggleSidebar" aria-label="Afficher les conversations">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="chat-title" id="chatTitle">Nouvelle mission</h1>
        <div class="status" id="status"><span class="dot"></span><span id="statusText">Prêt</span></div>
        <button class="icon-btn" id="toggleTheme" aria-label="Changer de thème">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn" id="togglePanel" aria-label="Afficher le panneau de l'agent">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
        </button>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <form class="composer" id="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="Décrivez un objectif… l'agent s'occupe du reste." aria-label="Message"></textarea>
          <div class="composer-row">
            <div class="mode-switch" role="radiogroup" aria-label="Mode">
              <button type="button" class="mode active" data-mode="autonome" role="radio" aria-checked="true">Autonome</button>
              <button type="button" class="mode" data-mode="assistant" role="radio" aria-checked="false">Assistant</button>
            </div>
            <span class="model-chip" id="modelChip"></span>
            <div class="spacer"></div>
            <button type="button" class="icon-btn" id="micBtn" aria-label="Dicter un message">
              <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            </button>
            <button type="submit" class="btn btn-primary send" id="sendBtn">Lancer</button>
            <button type="button" class="btn btn-danger send hidden" id="stopBtn">Arrêter</button>
          </div>
        </div>
      </form>
    </main>

    <!-- Panneau de l'agent -->
    <aside class="panel" id="panel" aria-label="Panneau de l'agent">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="plan" role="tab">Plan</button>
        <button class="tab" data-tab="memoire" role="tab">Mémoire</button>
        <button class="tab" data-tab="fichiers" role="tab">Fichiers</button>
      </div>
      <div class="tab-body" id="tab-plan"></div>
      <div class="tab-body hidden" id="tab-memoire"></div>
      <div class="tab-body hidden" id="tab-fichiers"></div>
    </aside>
  </div>

  <!-- Paramètres -->
  <dialog class="modal" id="settingsModal">
    <form method="dialog" class="modal-inner" id="settingsForm">
      <header class="modal-head">
        <h2>Paramètres</h2>
        <button class="icon-btn" value="cancel" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </header>
      <div class="modal-body">
        <fieldset>
          <legend>Fournisseur d'IA</legend>
          <label>Fournisseur
            <select id="sProvider" class="input"></select>
          </label>
          <label>URL de l'API (compatible OpenAI)
            <input id="sBaseUrl" class="input mono" placeholder="https://api.openai.com/v1" />
          </label>
          <label>Clé API
            <input id="sApiKey" class="input mono" type="password" autocomplete="off" placeholder="sk-…" />
            <small>Stockée uniquement dans votre navigateur. Envoyée seulement au fournisseur choisi.</small>
          </label>
          <label>Modèle
            <input id="sModel" class="input mono" placeholder="gpt-4o-mini" />
          </label>
          <div class="grid-2">
            <label>Température <output id="sTempOut">0.4</output>
              <input id="sTemp" type="range" min="0" max="1.5" step="0.1" />
            </label>
            <label>Étapes max. (autonome)
              <input id="sMaxSteps" class="input" type="number" min="1" max="50" />
            </label>
          </div>
          <button type="button" class="btn btn-ghost" id="testConn">Tester la connexion</button>
          <span class="test-result" id="testResult"></span>
        </fieldset>
        <fieldset>
          <legend>Comportement</legend>
          <label class="check"><input type="checkbox" id="sApproval" /> Demander mon accord avant les actions sensibles (code, lecture de pages)</label>
          <label class="check"><input type="checkbox" id="sTts" /> Lire les réponses à voix haute automatiquement</label>
          <label>Instructions personnalisées
            <textarea id="sSystem" class="input" rows="3" placeholder="Ex. : Réponds toujours de façon concise. Mon entreprise est basée à Conakry."></textarea>
          </label>
        </fieldset>
        <fieldset>
          <legend>Outils activés</legend>
          <div class="tools-grid" id="toolsGrid"></div>
        </fieldset>
        <fieldset>
          <legend>Données</legend>
          <div class="row-btns">
            <button type="button" class="btn btn-ghost" id="exportData">Exporter</button>
            <label class="btn btn-ghost file-btn">Importer<input type="file" id="importData" accept="application/json" hidden /></label>
            <button type="button" class="btn btn-danger-ghost" id="wipeData">Tout effacer</button>
          </div>
        </fieldset>
      </div>
      <footer class="modal-foot">
        <button class="btn btn-primary" value="save" id="saveSettings">Enregistrer</button>
      </footer>
    </form>
  </dialog>

  <!-- Confirmation -->
  <dialog class="modal small" id="confirmModal">
    <form method="dialog" class="modal-inner">
      <header class="modal-head"><h2 id="confirmTitle">Autoriser cette action ?</h2></header>
      <div class="modal-body"><pre class="confirm-detail" id="confirmDetail"></pre></div>
      <footer class="modal-foot">
        <button class="btn btn-ghost" value="no">Refuser</button>
        <button class="btn btn-primary" value="yes">Autoriser</button>
      </footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
